# SPDX-License-Identifier: Apache-2.0

compatible: "waveshare,esp32s3-lcd-cam-rgb"

description: |
  Waveshare ESP32-S3 LCD_CAM RGB display.

include:
  - display-controller.yaml
  - pinctrl-device.yaml

properties:
  width:
    type: int
    required: true

  height:
    type: int
    required: true

  pixel-clk-hz:
    type: int
    required: true
    description: RGB panel pixel clock frequency, in Hz

  hsync-len:
    type: int
    required: true

  hback-porch:
    type: int
    required: true

  hfront-porch:
    type: int
    required: true

  vsync-len:
    type: int
    required: true

  vback-porch:
    type: int
    required: true

  vfront-porch:
    type: int
    required: true

  data-width:
    type: int
    default: 16
    description: Number of parallel RGB data lines (8 or 16)

  hsync-idle-low:
    type: boolean
    description: HSYNC signal is active-high when set (idle state is low)

  vsync-idle-low:
    type: boolean
    description: VSYNC signal is active-high when set (idle state is low)

  de-idle-high:
    type: boolean
    description: DE signal is active-low when set (idle state is high)

  pclk-active-neg:
    type: boolean
    description: Data is clocked out on the falling edge of PCLK when set

  dmas:
    required: true

  dma-names:
    required: true